<html>
    <head>
        <style>
            canvas {
                display:block;
                width: 90vw;
                height: 90vh;
            }
        </style>
    </head>
<body>
    <canvas id = "canvas" width = "180" height="120"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d')
function plotPixel(x,y,color){
    ctx.fillStyle = color;
    ctx.fillRect(x,y,1,1);
}

for(let x = 0;x<100;x++){
    let y = (0.001 * (x * x * x)) + (0.001 * (x * x)) + (0.001*x);
    plotPixel(x,y,'red')
}

    </script>
</body>
</html>
